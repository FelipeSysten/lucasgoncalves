<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,300;0,400;0,500;0,600;0,700;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:1280px; overflow:hidden; }
  .stage{ position:relative; width:1280px; height:1280px; background:#0A0908; font-family:'Oswald',sans-serif; }
  .glow{ position:absolute; left:-200px; top:80px; width:1000px; height:1000px;
         background:radial-gradient(circle, rgba(201,162,39,0.14) 0%, rgba(201,162,39,0) 62%); }
  .gmark{ position:absolute; left:-150px; bottom:-120px; width:820px; opacity:0.07; }
  .foto-wrap{ position:absolute; right:-40px; top:150px; width:760px; height:950px; }
  .foto{ width:100%; height:100%; object-fit:cover; object-position:50% 0; display:block;
         -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 22%),; }
  .foto-fade-l{ position:absolute; inset:0; background:linear-gradient(90deg, #0A0908 0%, rgba(10,9,8,0.55) 16%, rgba(10,9,8,0) 42%); }
  .foto-fade-b{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,9,8,0) 55%, rgba(10,9,8,0.35) 78%, #0A0908 97%); }
  .foto-fade-t{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0) 22%); }

  .texto{ position:absolute; left:185px; top:238px; width:640px; z-index:3; }
  .kicker{ display:flex; align-items:center; gap:16px; font-weight:500; font-size:34px;
           letter-spacing:7px; color:#fff; margin-bottom:34px; }
  .kicker b{ color:#C9A227; font-weight:600; }
  .titulo{ font-weight:700; font-size:122px; line-height:0.98; letter-spacing:1px; color:#fff; }
  .titulo .ouro{ display:block; color:#C9A227; }
  .sub{ margin-top:30px; font-weight:400; font-size:34px; letter-spacing:5px; color:#CFC9BE; }
  .badge{ display:inline-flex; align-items:center; gap:18px; margin-top:44px; padding:22px 34px;
          border:2px solid rgba(201,162,39,0.55); border-radius:14px;
          background:linear-gradient(135deg, rgba(201,162,39,0.10), rgba(10,9,8,0.2)); }
  .badge .icone{ width:58px; height:58px; border-radius:12px; background:linear-gradient(135deg,#C9A227,#9A7B1B);
                 display:flex; align-items:center; justify-content:center; }
  .badge .linhas{ font-weight:500; font-size:27px; letter-spacing:2.5px; color:#fff; line-height:1.35; }
  .badge .linhas b{ color:#C9A227; font-weight:600; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <img class="gmark" src="../assets/g-mark.png" alt="">
  <div class="foto-wrap">
    <img class="foto" src="../assets/svc-consultoria.png" alt="">
    <div class="foto-fade-l"></div>
    <div class="foto-fade-b"></div>
    <div class="foto-fade-t"></div>
  </div>
  <div class="texto">
    <div class="kicker">CONSULTORIA <b>ONLINE</b>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M2 9.5a15 15 0 0 1 20 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
    </div>
    <div class="titulo">RESULTADOS<span class="ouro">DE VERDADE</span></div>
    <div class="sub">ONDE VOCÊ ESTIVER.</div>
    <div class="badge">
      <div class="icone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0A0908" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div class="linhas">SUA MELHOR VERSÃO<br>É O <b>NOSSO PLANO.</b></div>
    </div>
  </div>
</div>
</body>
</html>
