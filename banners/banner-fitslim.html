<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,300;0,400;0,500;0,600;0,700;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:1280px; overflow:hidden; }
  .stage{ position:relative; width:1280px; height:1280px; background:#0A0908; font-family:'Oswald',sans-serif; overflow:hidden; }
  .foto{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
  .fade-b{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0.05) 20%, rgba(10,9,8,0) 60%, rgba(10,9,8,0.45) 88%, rgba(10,9,8,0.75) 100%); }
  .fade-x{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0) 18%, rgba(10,9,8,0) 82%, rgba(10,9,8,0.55) 100%); }

  .kicker{ position:absolute; top:118px; left:50%; transform:translateX(-50%); z-index:3; white-space:nowrap;
           font-weight:500; font-size:18px; letter-spacing:4.5px; color:#EDEAE3; }
  .kicker b{ color:#C9A227; font-weight:500; }

  .lock{ position:absolute; top:56px; left:56px; z-index:3; display:inline-flex; align-items:center; gap:10px;
         padding:10px 20px; border-radius:999px; border:1.5px solid rgba(201,162,39,0.65); background:rgba(10,9,8,0.72);
         font-weight:600; font-size:16px; letter-spacing:2.5px; color:#fff; }

  .tag{ position:absolute; z-index:3; padding:8px 22px; border-radius:999px; font-weight:600; font-size:20px;
        letter-spacing:3px; border:1.5px solid rgba(201,162,39,0.65); background:rgba(10,9,8,0.72); }
  .tag.antes{ left:110px; top:200px; color:#B9B3A8; }
  .tag.depois{ right:110px; top:200px; color:#0A0908; background:linear-gradient(135deg,#C9A227,#9A7B1B); border-color:#C9A227; }

  .sublines{ position:absolute; left:112px; top:262px; z-index:3; display:flex; flex-direction:column; gap:9px; }
  .sublines div{ font-family:'Outfit',sans-serif; font-weight:500; font-size:16px; letter-spacing:1.5px; color:#8A857B; }
</style>
</head>
<body>
<div class="stage">
  <img class="foto" src="../assets/fitslim-transform.png" alt="">
  <div class="fade-b"></div>
  <div class="fade-x"></div>

  <div class="kicker">EMAGRECIMENTO <b>•</b> DEFINIÇÃO <b>•</b> SAÚDE <b>•</b> PERFORMANCE</div>

  <div class="lock">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    PROGRAMA COMPLETO
  </div>

  <div class="tag antes">ANTES</div>
  <div class="tag depois">DEPOIS</div>

  <div class="sublines">
    <div>SEM ENERGIA</div>
    <div>SEM CONFIANÇA</div>
    <div>SEM RESULTADOS</div>
  </div>
</div>
</body>
</html>
