<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,300;0,400;0,500;0,600;0,700;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:1280px; overflow:hidden; }
  .stage{ position:relative; width:1280px; height:1280px; background:#0A0908; font-family:'Oswald',sans-serif; overflow:hidden; }
  .foto{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
  .fade-b{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0.05) 20%, rgba(10,9,8,0) 45%, rgba(10,9,8,0.55) 74%, rgba(10,9,8,0.94) 96%); }
  .fade-x{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,9,8,0.55) 0%, rgba(10,9,8,0) 18%, rgba(10,9,8,0) 82%, rgba(10,9,8,0.55) 100%); }

  .kicker{ position:absolute; top:118px; left:50%; transform:translateX(-50%); z-index:3; white-space:nowrap;
           font-weight:500; font-size:18px; letter-spacing:4.5px; color:#EDEAE3; }
  .kicker b{ color:#C9A227; font-weight:500; }

  .tag{ position:absolute; z-index:3; padding:8px 22px; border-radius:999px; font-weight:600; font-size:20px;
        letter-spacing:3px; border:1.5px solid rgba(201,162,39,0.65); background:rgba(10,9,8,0.72); }
  .tag.antes{ left:330px; top:240px; color:#B9B3A8; }
  .tag.depois{ right:330px; top:240px; color:#0A0908; background:linear-gradient(135deg,#C9A227,#9A7B1B); border-color:#C9A227; }

  .bloco{ position:absolute; left:305px; bottom:495px; z-index:3; }
  .titulo{ font-weight:700; font-style:italic; font-size:150px; line-height:0.95; letter-spacing:2px;
           background:linear-gradient(135deg,#F3DD8E,#C9A227 55%,#8C6D1A);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           filter:drop-shadow(0 4px 18px rgba(0,0,0,0.85)); }
  .sub{ margin-top:10px; font-weight:500; font-size:30px; letter-spacing:6px; color:#fff; }
  .sub b{ color:#C9A227; font-weight:600; }

  .frase{ position:absolute; left:305px; bottom:412px; z-index:3; display:inline-flex; align-items:center; gap:16px;
          padding:16px 26px; border-radius:10px; background:linear-gradient(135deg,#C9A227,#9A7B1B);
          font-weight:700; font-size:26px; letter-spacing:3px; color:#0A0908; }
</style>
</head>
<body>
<div class="stage">
  <img class="foto" src="../assets/fitslim-transform.png" alt="">
  <div class="fade-b"></div>
  <div class="fade-x"></div>

  <div class="kicker">EMAGRECIMENTO <b>•</b> DEFINIÇÃO <b>•</b> SAÚDE <b>•</b> PERFORMANCE</div>

  <div class="tag antes">ANTES</div>
  <div class="tag depois">DEPOIS</div>

  <div class="bloco">
    <div class="titulo">FIT<br>SLIM</div>
    <div class="sub">O CÓDIGO PARA <b>O SEU MELHOR CORPO</b></div>
  </div>

  <div class="frase">DESBLOQUEIE A SUA MELHOR VERSÃO
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A0908" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </div>
</div>
</body>
</html>
